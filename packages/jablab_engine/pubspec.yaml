name: jablab_engine
description: >-
  Standing Striking Engine — JabLab'ın branş-bağımsız ayakta-vuruş analiz
  motoru. Boks bir içerik paketidir (assets/rulesets/boxing@1.x.json); motor
  kodunda hiçbir boks terimi sabit değildir (ADR-004). Saf Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # PİNLİ TÜKETİM (M-F-03 + çekirdek 0.1.0 etiketi). Path bağımlılığı
  # KASITLI olarak terk edildi: paylaşımlı çalışma ağacında path, o an hangi
  # dal çıkılıysa onu okur — yani bağımlılığımız başka bir oturumun dal
  # değiştirmesiyle sessizce değişirdi. Tag'e pinleme bunu imkânsız kılar ve
  # M-F-22 (paylaşımlı ağaçta dal değiştirme yasağı) ile de uyumludur.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      # TAG'IN COMMIT'I — motion_camera pini ile AYNI olmak ZORUNDA
      # (pin esitligi; yukarıdaki nota bkz). == motion_camera-v0.1.2
      # ve o commit'teki motion_core surumu 0.11.0.
      ref: f43d71a375431e96c689a7a4a04fb53ff01af693

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
