name: jablab_engine
description: >-
  Standing Striking Engine — JabLab'ın branş-bağımsız ayakta-vuruş analiz
  motoru. Boks bir içerik paketidir (assets/rulesets/boxing@1.x.json); motor
  kodunda hiçbir boks terimi sabit değildir (ADR-004). Saf Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # PİNLİ TÜKETİM (M-F-03 + çekirdek 0.1.0 etiketi). Path bağımlılığı
  # KASITLI olarak terk edildi: paylaşımlı çalışma ağacında path, o an hangi
  # dal çıkılıysa onu okur — yani bağımlılığımız başka bir oturumun dal
  # değiştirmesiyle sessizce değişirdi. Tag'e pinleme bunu imkânsız kılar ve
  # M-F-22 (paylaşımlı ağaçta dal değiştirme yasağı) ile de uyumludur.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      # ⚠️ SHA, tag DEĞİL — ve sebebi tesisat, tercih değil (J-071 ölçümü):
      # app `motion_camera`yı git-dep ile çekiyor, o plugin ise `motion_core`u
      # PATH ile çekiyor (aynı repo). pub, plugin'in transitif core'unu
      # ÇÖZÜLMÜŞ SHA olarak görüyor ("...at 03ff936... in packages/motion_core"),
      # buradaki pini ise TAG ADI olarak. Aynı commit olsalar bile iki
      # DESCRIPTOR farklı sayılıyor ve çözüm başarısız oluyor:
      #   "motion_camera from git is incompatible with jablab_engine from path"
      # Bu yüzden ref SHA'ya sabitlendi. Okunabilirlik kaybını yorum kapatıyor:
      #   03ff936 == motion_core-v0.8.8 == motion_camera-v0.1.0 (aynı commit)
      # Tag rejimi (M-F-03) TERK EDİLMEDİ — tag'in işaret ettiği commit
      # yazılıyor; pin hâlâ değişmez ve `dependency_pin_test` eşitliği zorluyor.
      # GECICI: motion_camera dal commit'iyle AYNI olmak ZORUNDA (pin
      # esitligi, J-071). Icerik motion_core-v0.8.8 ile BIREBIR AYNI —
      # dalin tek degisikligi plugin'in Swift dosyasi. Merge+retag sonrasi
      # tag'e doner.
      ref: 5b86df5c927763a195b526c976be10fb8ffebb1c

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
