name: jablab
description: "JabLab — Solo Combat Training. 8 disiplinli, canlı sesli koçluklu solo dövüş antrenmanı."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  jablab_engine:
    path: packages/jablab_engine
  # F-3/J-064: seans geçmişi Fitness vaadinin ("çalıştığını kaydet") VERİ
  # KATMANI. Yalnız uygulama-özel dizini bulmak için — depolama biçimi
  # uygulamanın kendisinde (append-only JSONL, `lib/app/session_store.dart`).
  # 3. taraf DB BİLEREK YOK: sorgu ihtiyacı ölçülünce gelir.
  path_provider: ^2.1.0
  # KAMERA KÖPRÜSÜ (J-071). TAG'e pinli git-dep (M-F-154 rejimi + M-F-03):
  # path bağımlılığı paylaşımlı ağaçta o an hangi dal çıkılıysa onu okur,
  # yani bağımlılığımız başka bir oturumun dal değiştirmesiyle sessizce
  # değişirdi.
  #
  # ⚠️ PİN EŞİTLİĞİ ZORUNLU: bu plugin `motion_core`u PATH ile çekiyor
  # (aynı repo). `motion_camera-v0.1.2` ve `motion_core-v0.11.0` AYNI
  # COMMIT (f13bdc9) — bu yüzden `jablab_engine` de 0.11.0'a yükseltildi.
  # (Tag'ler ayrı commit'lerde duruyor ama f13bdc9 İKİSİNİ birden taşıyor;
  # tek pin, çift-kaynak çatışması yok — M-F-260.)
  # Farklı ref'ler olsaydı pub aynı paket için iki kaynak görüp çözemezdi.
  # `test/dependency_pin_test.dart` bu eşitliği zorluyor.
  # `motion_core` DOĞRUDAN da bildiriliyor: harness `BodyOrientation`ı
  # doğrudan kullanıyor ve transitif bir paketten tip almak
  # (depend_on_referenced_packages) bağımlılığı görünmez kılar — plugin
  # yarın core'u bırakırsa app sessizce kırılırdı. Pin motion_camera ile
  # AYNI commit olmak zorunda (descriptor eşitliği, J-071).
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_camera
      # TAG'IN COMMIT'I (M-F-154 zeyli, J-071 bulgusu): tag ADI yazilamaz.
      # Plugin `motion_core`u PATH ile cekiyor; pub onun transitif core'unu
      # COZULMUS SHA olarak, buradaki pini TAG ADI olarak gorur ve ayni
      # commit olsalar bile descriptor'lari FARKLI sayar:
      #   "motion_camera from git is incompatible with jablab_engine from path"
      # Bu yuzden pin daima tag'in COMMIT'i olarak yazilir; hangi tag oldugu
      # yorumda durur ve `dependency_pin_test` esitligi zorlar.
      #   f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d == motion_camera-v0.1.2
      # (v0.1.0'in iOS Swift katmani 0.10.21'e karsi DERLENMIYORDU — J-071;
      #  v0.1.1 o duzeltmeyi tasiyor ve basligi COMPILED-NOT-RUN.)
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d
  permission_handler: ^12.0.3
  # Design turu (2026-08-06): JabLab.dc.html spec board iki tipografi ailesi
  # zorunlu kılıyor — Familjen Grotesk (insan sesi) + IBM Plex Mono (yalnız
  # ÖLÇÜLEN şeyler: saat, sayaç, teknik sebep). İkisi de sistem fontu değil.
  #
  # ⚠️ D1 (2026-08-16, F2): önceden `google_fonts` ile ÇALIŞMA ANINDA
  # fonts.gstatic.com'dan çekiliyordu — J-264/J-217'nin ölçtüğü olgu.
  # `fonts:` bildirimi aşağıda .ttf'leri PAKETLİYOR; artık runtime ağ
  # isteği YOK. Bkz. `test/network_deps_test.dart` (regresyon kapısı).

dev_dependencies:
  flutter_test:
    sdk: flutter
  # CİHAZDA koşan smoke için (J-072): köprünün gerçek native katmanı yalnız
  # gerçek bir cihaz/emülatörde çalışır; widget testi onu göremez.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    # PİNLİ poz modeli (§6 / M-L-01). Dosyanın KENDİSİ git'te DEĞİL — aile
    # kuralı `.task` ikililerini izlemiyor; `tool/fetch_pose_model.sh`
    # indirir/kopyalar ve SHA-256 doğrular. `model_pin_test` dosya varsa
    # hash'i zorlar, yoksa İSİMLİ sebeple atlar (sessiz geçmez).
    - assets/models/
    - assets/rulesets/
    # D1 — OFL lisans metinleri asset OLARAK bildirilir (kaynağı görünür
    # kılmak için); `.ttf`'leri AŞAĞIDAKİ `fonts:` bildirimi ayrıca paketler.
    - assets/fonts/FamiljenGrotesk/OFL.txt
    - assets/fonts/IBMPlexMono/OFL.txt
  fonts:
    # D1 (2026-08-16, F2): önceden `google_fonts` ile ÇALIŞMA ANINDA
    # fonts.gstatic.com'dan çekiliyordu (J-264/J-217). Artık PAKETLİ, OFL
    # 1.1. Ağırlıklar ÖLÇÜLENLE birebir (`grep -rohn 'FontWeight\.w[0-9]\+
    # \|GoogleFonts\.' lib/app/design_tokens.dart`): Familjen Grotesk
    # 400/700, IBM Plex Mono 400/500/600 — yeni bir ağırlık koda girerse bu
    # listeye de eklenmeli, yoksa en yakın bildirilen ağırlığa sessizce düşer.
    - family: Familjen Grotesk
      fonts:
        - asset: assets/fonts/FamiljenGrotesk/FamiljenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/FamiljenGrotesk/FamiljenGrotesk-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-SemiBold.ttf
          weight: 600
